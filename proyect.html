<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Proyecto... | Isabel Puelma</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="page-overlay" aria-hidden="true"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header class="header">
        <a href="index.html" class="brand-name"><img src="isabelpuelma.svg" alt="Logo"></a>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link">Archivo</a>
            <a href="about.html" class="nav-link">Info</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
        <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </header>

    <div class="mobile-nav-overlay" id="mobileNav">
        <a href="index.html" class="mobile-link">Home</a>
        <a href="gallery.html" class="mobile-link">Work</a>
        <a href="about.html" class="mobile-link">Info</a>
        <a href="contact.html" class="mobile-link">Contact</a>
    </div>

<main id="main-content">
    <section class="project-hero" style="min-height: 90vh; padding-top: 15vh;">
        <div style="padding: 0 var(--spacing-margin);">
            
            <a href="javascript:history.back()" class="inline-back-button">← Volver</a>

            <h1 id="dyn-title" class="display-text" style="font-size: clamp(3rem, 10vw, 10rem); margin-bottom: 2rem;">Título</h1>
            <p id="dyn-desc" class="text-h2" style="font-size: 1.2rem; margin-bottom: 15rem;">Descripción...</p>
            
            <div class="project-meta-grid" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2rem; border-top: 1px solid var(--grid-line-color); padding-top: 2rem;">
                <div><span style="opacity: 0.5; font-size: 0.7rem; text-transform: uppercase;">Cliente</span><p id="dyn-client">—</p></div>
                <div><span style="opacity: 0.5; font-size: 0.7rem; text-transform: uppercase;">Año</span><p id="dyn-year">—</p></div>
                <div><span style="opacity: 0.5; font-size: 0.7rem; text-transform: uppercase;">Servicios</span><p id="dyn-services">—</p></div>
                <div><span style="opacity: 0.5; font-size: 0.7rem; text-transform: uppercase;">Herramientas</span><p id="dyn-tools">—</p></div>
            </div>
        </div>
    </section>
</main>

        <!-- CONTENEDOR DE NARRATIVA DINÁMICA -->
        <div id="dyn-narrative-container">
            <!-- Aquí portafolio.js inyectará los módulos Bento, Ticker, Quotes, etc. -->
        </div>

        <!-- SIGUIENTE PROYECTO -->
        <section style="padding: 15vh var(--spacing-margin); text-align: center; border-top: 1px solid var(--grid-line-color);">
            <p style="opacity: 0.5; text-transform: uppercase; font-size: text-mono; margin-bottom: 2rem;">Siguiente Proyecto</p>
            <a id="next-project-link" href="#" class="display-text" style="font-size: clamp(2rem, 8vw, 6rem); transition: color 0.3s;">
                <span id="next-project-name">Título</span>
            </a>
        </section>
    </main>

    <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="data.js"></script>
    <script src="portafolio.js"></script>
</body>
</html>
