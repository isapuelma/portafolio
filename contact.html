<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACTO | Isabel Puelma</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="page-overlay" aria-hidden="true"></div>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-outline" aria-hidden="true"></div>

    <header class="header" role="banner">
        <a href="index.html" class="brand-name">
            <img src="isabelpuelma.svg" alt="Logo">
        </a>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link">Work</a>
            <a href="about.html" class="nav-link">Info</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </nav>
        <button class="hamburger" id="hamburgerBtn">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="mobile-nav-overlay" id="mobileNav">
        <a href="index.html" class="mobile-link">Home</a>
        <a href="gallery.html" class="mobile-link">Work</a>
        <a href="about.html" class="mobile-link">Info</a>
        <a href="contact.html" class="mobile-link">Contact</a>
    </div>

    <main id="main-content">
        <section class="contact-premium-grid">
            
            <div class="contact-info-panel reveal-element">
                <div>
                    <span class="text-mono contact-badge"></span>
                    <h1 class="contact-display-title">Hablemos.</h1>
                    <p class="contact-lead-text">Transformemos tu visión estratégica en un ecosistema de diseño con valor comercial real.</p>
                </div>
                
                <div class="contact-links-block">
                    <span class="text-mono contact-sub-badge">Canales Directos</span>
                    <a href="mailto:mipuelma@uc.cl" class="contact-text-link">mipuelma@uc.cl ↗</a>
                    <a href="https://instagram.com/isa_puelma" target="_blank" class="contact-text-link">Instagram ↗</a>
                </div>
            </div>

            <div class="contact-form-panel reveal-element">
                <form id="contactForm" class="premium-input-form">
                    
                    <div class="input-group">
                        <input type="text" name="name" id="form-name" required placeholder=" ">
                        <label for="form-name" class="text-mono">Tu nombre completo</label>
                        <span class="input-border-line"></span>
                    </div>
                    
                    <div class="input-group">
                        <input type="email" name="email" id="form-email" required placeholder=" ">
                        <label for="form-email" class="text-mono">Tu correo electrónico</label>
                        <span class="input-border-line"></span>
                    </div>

                    <div class="input-group">
                        <textarea name="message" id="form-message" required rows="2" placeholder=" "></textarea>
                        <label for="form-message" class="text-mono">¿Cómo puedo ayudarte en tu proyecto?</label>
                        <span class="input-border-line"></span>
                    </div>

                    <div class="submit-action-container">
                        <button type="submit" class="contact-submit-btn">
                            <span>Enviar Propuesta</span>
                            <i class="ph ph-arrow-up-right"></i>
                        </button>
                    </div>
                </form>
                
                <div id="formFeedback" class="premium-form-success">
                    <i class="ph ph-check-circle"></i>
                    <p class="text-mono">Mensaje enviado con éxito. Te responderé a la brevedad.</p>
                </div>
            </div>
            
        </section>
    </main>

    <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="data.js"></script>
    <script src="portafolio.js"></script>
    
    <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        this.style.display = 'none';
        document.getElementById('formFeedback').style.display = 'flex';
    });
    </script>
</body>
</html>
